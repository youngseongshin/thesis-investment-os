<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}발언록{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 타이포그래피는 KRDS(정부 디자인 시스템) 램프를, 위계 표현은 테두리가 아닌
     여백·구분선·배경 틴트를 따른다. 글자 크기 하한 0.92rem. */
  :root {
    --ink: #191f28; --sub: #4e5968; --muted: #8b95a1;
    --line: #e5e8eb; --line-strong: #b0b8c1;
    --bg: #ffffff; --tint: #f7f8fa;
    --accent: #246beb; --accent-tint: #eef3fd;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         font-size: 16px; line-height: 1.72; word-break: keep-all;
         -webkit-font-smoothing: antialiased; }
  .shell { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }

  header.site { border-bottom: 1px solid var(--line); }
  header.site .shell { display: flex; align-items: baseline; justify-content: space-between;
                       padding-top: 1.1rem; padding-bottom: 1.1rem; }
  .brand { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em;
           color: var(--ink); text-decoration: none; }
  nav a { color: var(--sub); text-decoration: none; font-size: 0.96rem; margin-left: 1.1rem; }
  nav a:hover { color: var(--accent); }

  main { padding: 2.75rem 0 4.5rem; }
  h1 { font-size: 1.62rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.4rem; }
  h2 { font-size: 1.09rem; font-weight: 700; letter-spacing: -0.01em; margin: 2.2rem 0 0.5rem; }
  p { margin: 0.55rem 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .lead { color: var(--sub); font-size: 1.02rem; margin: 0 0 1.6rem; }
  .muted { color: var(--muted); font-size: 0.92rem; }
  .num { font-variant-numeric: tabular-nums; }

  /* 목록: 바깥 상자 없이 머리 밑줄 1px과 행 구분선만 쓴다 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 0.92rem; font-weight: 600; color: var(--muted);
       padding: 0.5rem 0.6rem 0.55rem; border-bottom: 1px solid var(--line-strong); }
  td { padding: 0.72rem 0.6rem; border-bottom: 1px solid var(--line); font-size: 0.99rem; }
  td.num, th.num { text-align: right; }
  tbody tr:hover { background: var(--tint); }
  td a { color: var(--ink); font-weight: 600; }
  td a:hover { color: var(--accent); text-decoration: none; }

  input[type="search"] { width: 100%; padding: 0.7rem 0.95rem; margin: 0 0 1.5rem;
                          font: inherit; font-size: 0.99rem; color: var(--ink);
                          border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); }
  input[type="search"]:focus { outline: none; border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--muted); }

  /* 발언 타임라인: 날짜 아래 발언을 여백과 구분선으로 나눈다 */
  .day { margin: 2.4rem 0 0; padding-top: 1.1rem; border-top: 1px solid var(--line-strong);
         font-weight: 700; font-size: 1.02rem; }
  .day .session { font-weight: 400; color: var(--muted); font-size: 0.92rem; margin-left: 0.5rem; }
  .utt { padding: 1.15rem 0 1.25rem; }
  .utt + .utt { border-top: 1px solid var(--line); }
  .who { font-size: 0.96rem; font-weight: 600; color: var(--sub); }
  .who .role { font-weight: 400; color: var(--muted); margin-left: 0.35rem; }
  .chip { display: inline-block; font-size: 0.92rem; color: var(--accent);
          background: var(--accent-tint); border-radius: 6px;
          padding: 0.05rem 0.5rem; margin-left: 0.45rem; vertical-align: 0.05em; }
  .speech { white-space: pre-line; margin: 0.5rem 0 0.6rem; }
  .srcline { font-size: 0.92rem; color: var(--muted); }
  .srcline a { color: var(--sub); text-decoration: underline; text-underline-offset: 2px; }
  .srcline a:hover { color: var(--accent); }

  .notice { background: var(--tint); border-radius: 8px; padding: 0.9rem 1.1rem;
            font-size: 0.96rem; color: var(--sub); }

  footer.site { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.92rem; }
  footer.site .shell { padding-top: 1.3rem; padding-bottom: 2.6rem; }
  footer.site p { margin: 0.2rem 0; }

  @media (max-width: 480px) {
    body { font-size: 15px; }
    h1 { font-size: 1.45rem; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="shell">
    <a class="brand" href="{{ root }}index.html">발언록</a>
    <nav><a href="{{ root }}index.html">인물</a><a href="{{ root }}about.html">소개</a></nav>
  </div>
</header>
<main>
  <div class="shell">
  {% block content %}{% endblock %}
  </div>
</main>
<footer class="site">
  <div class="shell">
    <p>발언은 공개된 국회 회의록에서 옮겨 실었으며, 모든 발언에 원문 출처가 표시됩니다.</p>
    <p>잘못 옮겨진 내용은 정정 요청을 받아 바로잡습니다. <span class="num">{{ generated_at }}</span> 갱신.</p>
  </div>
</footer>
</body>
</html>
